# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Continuity of the phase transition for planar random-cluster and Potts models with 1 <= q <= 4 (Theorems 1, 2 and 3)"
  description: >-
    A complete Lean 4 / Mathlib formalization of Theorems 1, 2 and 3 of Duminil-Copin, Sidoravicius
    and Tassion (arXiv:1505.04159v1). Theorem 3: for the random-cluster model on the square lattice
    with any real cluster weight q >= 1, at its critical point p_c, the following are equivalent:
    the origin lies in an infinite cluster with probability 0 under the wired measure; equality of
    the free and wired measures; infinite
    susceptibility of the free measure; sub-exponential decay of the free one-arm probability; and
    the RSW bound for free boundary conditions at distance n. Theorem 2: for 1 <= q <= 4 the wired
    measure at p_c gives probability 0 to the origin lying in an infinite cluster. Theorem 1: for the q-state Potts model with q = 2, 3, 4,
    the monochromatic Gibbs measure at beta_c gives its own colour at the origin probability exactly
    1/q, so the phase transition is continuous. The critical points are the genuine phase-transition
    thresholds, whose existence the theorems assert; four further theorems prove that these critical
    points and the infinite-volume measures are unique;
    beyond this statement surface, the development also proves p_c = sqrt(q)/(1 + sqrt q) for every
    q >= 1 (PottsContinuity.BD12.isRCCriticalPoint_sqrt) and beta_c = log(1 + sqrt q) for every
    integer q >= 2 (PottsContinuity.Thm1.isPottsCriticalPoint_log_sqrt); these identifications are
    not checked by Comparator. The infinite-volume measures are limits along
    every exhaustion of the lattice, and their existence and uniqueness are proved. The external
    results that the paper cites and the proof uses (the value of p_c and the crossing estimates of
    Beffara-Duminil-Copin, the contour identity of the parafermionic observable in the form used in
    Section 4 of the paper, Theorem 4 of the paper, the Edwards-Sokal coupling, FKG and comparison
    inequalities, the domain Markov property, planar duality and topology) are proved here or taken
    from Mathlib; the Jordan-Schoenflies theorem
    and Brouwer's fixed-point theorem come from vendored libraries, and circle-degree and
    Jordan-curve facts from the Tau Ceti library. The only axioms are propext, Classical.choice and Quot.sound.
  authors:
    - "Zijie Zhuang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Zijie Zhuang"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.PR", "math-ph"]
  msc2020: ["82B20", "82B26", "82B43", "60K35"]

