status:
  scope: >-
    Formalized: Theorems 1, 2 and 3 in full, as the Lean theorems PottsContinuity.theorem_1,
    PottsContinuity.theorem_2 and PottsContinuity.theorem_3, together with the four uniqueness
    theorems PottsContinuity.isRCInfiniteVolumeLimit_unique, PottsContinuity.isRCCriticalPoint_unique,
    PottsContinuity.isPottsInfiniteVolumeLimit_unique and PottsContinuity.isPottsCriticalPoint_unique,
    which show that the infinite-volume measures and critical points asserted to exist are unique;
    and the intermediate results of the paper on which the proofs rely: Proposition 1 (for
    0 < p < 1), Propositions 3 and 4,
    Proposition 2 in the directions the proof uses (P5 implies P5a, and P5b with R = 8 implies P5),
    Lemmas 1-8, Theorems 4 and 9, Theorem 10 in the form used in Section 4 (a summed contour identity
    on finite boxes of the universal cover, for 1 <= q <= 4), and the value of p_c from [BD12a]; some
    of them in corrected form (see fidelity). The identifications p_c = sqrt(q)/(1 + sqrt q) and
    beta_c = log(1 + sqrt q) are proved in the development but are not part of the Comparator-checked
    statement surface.
    Not formalized: the applications stated in the introduction (Theorems 5-8) and their proofs in
    Section 5 (including Lemmas 9 and 10), and the result for q > 4 (Proposition 5).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PottsContinuity.theorem_1"
      file: "PottsContinuity/Frozen/Theorem1.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PottsContinuity.theorem_2"
      file: "PottsContinuity/Frozen/Theorem2.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PottsContinuity.theorem_3"
      file: "PottsContinuity/Frozen/Theorem3.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PottsContinuity.isRCInfiniteVolumeLimit_unique"
