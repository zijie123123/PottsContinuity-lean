automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
        - "claude-sonnet (version not recorded)"
        - "gpt-6-luna"
        - "gpt-6.1-sol"
      framework: "Claude Code (orchestrator) with OpenAI Codex CLI proof workers, Claude Sonnet reviewer agents and Claude Opus agents for extracting the source dependency graph"
      tool_setup: >-
        Orchestrator-worker workflow based on the LeanAutoformalizationSkills repository
        (https://github.com/scottnarmstrong/LeanAutoformalizationSkills). The statements of the
        seven main theorems and of their 22 definitions were transcribed from the paper, audited by
        two independent reviewer agents, approved by the author and frozen before any proof work; a
        source-level proof dependency graph was extracted from the paper and reviewed; proof workers
        (up to about fifteen in parallel, on disjoint directories) proved graph nodes below the
        frozen statements; each main theorem received an independent agent audit after its proof was
        assembled (statement fidelity, proof assembly, axioms). Builds used local Lean/Lake.
      cost:
        wall_time: "about two days of agent work (2026-10-19 to 2026-10-20), plus release preparation"
        spend_usd: "not tracked"
        hardware: "one local machine (18 cores, 64 GB RAM) and model APIs"
      prompting_notes: >-
        Each worker received a bounded brief: one target, the files it owns, the allowed
        dependencies, the validation commands and a stop condition. Frozen statements could not be
        changed; a worker that found a step of the source wrong had to stop and report, and the
        orchestrator ruled on a repaired route (see fidelity).
  spend_usd: "not tracked"
  notes: >-
    The author directed the work, approved the exact Lean statements and the representation choices
    listed in the README, and decided all scope questions. Proof search, proof writing and reviews
    were done by AI agents; the Lean kernel (and, for the submission, Comparator with independent
    kernels) checks the result.

fidelity:
  divergences: >-
    Representation choices (approved before proving; see the README): finite volumes are subgraphs
    of Z^2 induced by finite vertex sets, with the vertex boundary taken literally and the Potts
    Hamiltonian counting the edges that meet the finite volume; infinite-volume measures are limits
    along every increasing exhaustion of Z^2 by finite vertex sets, with weak convergence expressed as
    convergence of all finite-dimensional cylinder probabilities, and their existence is proved; the
    critical points p_c and beta_c are the genuine thresholds defined by the phase transition; each
    theorem asserts the existence of the critical point and of the infinite-volume measures with the
    stated properties, and four separate theorems prove that these objects are unique; Potts colours
    are Fin q, inverse temperatures range over beta >= 0, and random-cluster boundary conditions are
    Fin 2 (0 free, 1 wired); P3 is a sum in [0, infinity]; P4 uses Real.log of a positive
    probability; in P5 the rectangle [0, alpha n] x [0, n] is the set of lattice points with first
    coordinate between 0 and floor(alpha n), the outer free rectangle has margin exactly n, and open
    paths need not be self-avoiding. Intermediate statements formalized in corrected or partial form
    (Theorems 1-3 are unaffected): Theorem 10 (cited from [Dum13]) only in the summed form used in
    Section 4, on finite boxes of the universal cover (for 1 <= q < 4 with the parafermionic
    observable, for q = 4 with the winding observable), not for general Dobrushin domains;
    Proposition 2 only in the directions used; P5a for n >= 2 (for
    n = 1 its annulus is empty and the printed bound fails); the second alternative of Proposition 3
    as exp(-c n^beta) with some c > 0 (the printed exp(-n^alpha) can fail at small n), stated as a
    disjunction (the exclusivity of the two alternatives is not formalized) and proved with the
    inputs of its proof (the recurrence of Lemma 4 and a reflected-FKG construction) as hypotheses,
    which the proof of Theorem 3 supplies
    (PottsContinuity.RSW.selfDual_dualityP_corrected_of_induction1_reflectedFKG); Proposition 4
    with the hypothesis exp(-c_0 n^alpha), proved with the touching estimate of Lemma 6 as a
    hypothesis, which the proof of Theorem 3 supplies
    (PottsContinuity.Thm3.Prop4.dualityQ_corrected_of_touch); Lemma 7 with the hypothesis
    exp(-c_0 n^alpha), proved with the touching estimate of Lemma 6 as a hypothesis
    (PottsContinuity.Thm3.Prop4.evenSquarePairKernel_of_touch); Proposition 1 (the domain Markov
    property) for 0 < p < 1 rather than p in [0, 1]; Lemma 6 with the constant
    1/(20 m^2 n^2) instead of 1/(5 m^2 n^2) (the printed constant is not formalized in this release,
    and whether it holds in general is not settled here; all uses of Lemma 6 need only a polynomial
    bound); the estimate phi^0[u <-> v in D] >= (1 - 4 n^(1+eps) exp(-n^(alpha eps))) phi^0[E] in the
    proof of Lemma 7 (p. 36, unnumbered in the printed paper) is not formalized in this form: the
    proof uses phi^1_{Lambda_n}[tube crossing] * phi^0[E] <= phi^0[u <-> v in D] for a tube D around
    the segment from u to v (PottsContinuity.Thm3.Prop4.between_trace_core_probability_mul_le_confined)
    and a lower bound 1/2 on the wired tube-crossing probability for all large n
    (PottsContinuity.Thm3.Prop4.selfDual_wired_box_strict_core_uniform_ge_half);
    eq. (3) in the form of [BD12a, Lemma 7] and of its uses in the
    paper (the two separately wired sides of a square are joined), not the printed C_h(Lambda_n)
    between the free sides; it is stated for squares with separately
    wired sides. Repairs of proof steps, including: in the proof of Lemma 4 the deduction of the
    dual circuits F_n from the connection events of eq. (15) fails for the formal definitions (a
    configuration with n = 3 was found during the development), and the three connection events are
    replaced by decreasing primal-blocking events that keep the bound (1+q^2)^(-3); in the proof of
    Lemma 6 the number of candidate vertices (lattice points of S(n, nm^2, theta)) is at most
    (n+1)(2nm^2+1), with equality for theta = 0, rather than n(2nm^2+1), and the
    half-height bound is proved for the infinite tilted strip with an exactly self-dual carrier and
    an almost-sure cover by fully open columns; in the proof of Lemma 7 the covering step before the estimate on p. 36 uses integer radii
    (with the real radius n^eps the printed covering statement fails for some configurations, found
    during the development; the configuration is not included in this repository);
    the proof of Proposition 3 chains fifteen translated events but uses the exponent 1/14, and the
    formal proof uses an arbitrary positive gluing power; the Edwards-Sokal identity on p. 7 lacks
    the factor 1 - 1/q, and the proof uses mu[sigma_0 = i] = 1/q + (1 - 1/q) phi^1[0 <-> infinity];
    in the final induction of Proposition 4 the base rate is a minimum rather than the printed
    maximum; in the cited sharpness proof of Duminil-Copin-Raoufi-Tassion the Russo coefficient
    lacks a factor exp(beta J) and an endpoint update is misprinted, and the corrected forms are
    used; implicit steps are proved (limit passages from finite to infinite volume, rounding and margins in
    Section 3, planar-topology facts, a reversed inequality in the final computation of Lemma 1).

review:
  status: "agent-reviewed"
  reviewers:
    - "independent Claude Sonnet reviewer agents (statement audits, dependency-graph reviews, final audits of each main theorem)"
  notes: >-
    Two reviewer agents compared every frozen definition and theorem statement with the paper
    (definition and declaration fidelity, no excess hypotheses) before the author approved them;
    the source dependency graph was reviewed slice by slice and globally, and its amendments for the
    repaired proof steps were reviewed independently; each main theorem was audited after its proof
    was assembled (exact statement, proof assembly only, axioms). No human mathematician has
    refereed the formal development.

alignment:
  namespace: "PottsContinuity"
  statements:
    - source: "Theorem 1"
      lean: "PottsContinuity.theorem_1"
      module: "PottsContinuity.Frozen.Theorem1"
      status: "proved"
      note: "q in {2, 3, 4}; one critical inverse temperature for all colours; Gibbs measures as limits along every exhaustion."
    - source: "Theorem 2"
      lean: "PottsContinuity.theorem_2"
      module: "PottsContinuity.Frozen.Theorem2"
      status: "proved"
      note: "Every real q in [1, 4]; the genuine critical point and the wired infinite-volume measure."
    - source: "Theorem 3"
      lean: "PottsContinuity.theorem_3"
      module: "PottsContinuity.Frozen.Theorem3"
      status: "proved"
      note: "Every real q >= 1; one List.TFAE of P1-P5 with the lattice rounding of P5 described in the docstring."
    - source: "well-definedness of the random-cluster infinite-volume measures phi^0, phi^1 (implicit in the paper's notation, pp. 5-6)"
      lean: "PottsContinuity.isRCInfiniteVolumeLimit_unique"
      module: "PottsContinuity.Frozen.IsRCInfiniteVolumeLimitUnique"
      status: "proved"
      note: "Makes the existential formulation of Theorems 2 and 3 pick out the unique measures."
    - source: "well-definedness of p_c(q) (implicit in the paper's notation, p. 6)"
      lean: "PottsContinuity.isRCCriticalPoint_unique"
      module: "PottsContinuity.Frozen.IsRCCriticalPointUnique"
      status: "proved"
      note: "Makes the existential formulation of Theorems 2 and 3 pick out the unique critical point."
    - source: "well-definedness of the Potts Gibbs measures with monochromatic boundary conditions (p. 4)"
      lean: "PottsContinuity.isPottsInfiniteVolumeLimit_unique"
      module: "PottsContinuity.Frozen.IsPottsInfiniteVolumeLimitUnique"
      status: "proved"
      note: "Makes the existential formulation of Theorem 1 pick out the unique measures."
    - source: "well-definedness of beta_c(q) (p. 4)"
      lean: "PottsContinuity.isPottsCriticalPoint_unique"
      module: "PottsContinuity.Frozen.IsPottsCriticalPointUnique"
      status: "proved"
      note: "Makes the existential formulation of Theorem 1 pick out the unique critical inverse temperature."

