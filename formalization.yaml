related_formalizations:
  - id: "FKconvergence: unpublished Lean 4 development by Zijie Zhuang (2026), not publicly accessible"
    relationship: "adapts"
    note: >-
      An earlier Lean 4 development by the same author on the critical planar FK (random-cluster)
      model on the square lattice with 1 <= q < 4. It has not been published and is not publicly
      accessible; there is no URL, release or commit that could be cited, so it is identified by its
      project name, FKconvergence. 739 of the 3007 modules under PottsContinuity/ (about 110,000 of
      315,000 lines) are adapted from it, and each of them says so in its header: 642 in FKC/
      (finite FK measures on graphs, boundary conditions, comparison and finite-energy inequalities,
      discrete domains and curves, medial graphs, the parafermionic observable and its contour
      identities), 53 in Thm4/ (the parafermionic route to Theorem 4), 37 in PlanarMixed/ (rectangle
      duality with mixed boundary conditions) and 7 elsewhere. 524 of them relocate modules and
      namespaces only (declarations not used here were removed; apart from the edits of the port
      described in the README), and 118 more also replace wrappers of
      the SLE development by PottsContinuity/FKC/SLEWrap/; the others reuse this development's
      carriers, extend the parameters (for example the cluster weight to the closed interval [1, 4],
      including q = 4) or adapt individual arguments. In addition, 101 of the 191 modules adapted from
      PottsDiscontinuity (next entry) had been adapted there, in whole or in part, from FKconvergence. The statements of the
      seven main theorems and their 22 definitions (PottsContinuity/Frozen/) were transcribed from the
      paper and are not taken from it.
  - id: "https://github.com/zijie123123/PottsDiscontinuity-lean at commit 435fb57856860eda7a65c8fec9e5fb29eff2b46b"
    relationship: "adapts"
    note: >-
      The author's formalization of Theorems 1.1 and 1.2 of arXiv:1611.09877 (discontinuity of the phase
      transition for q > 4), publicly available. 191 of the 3007 modules under PottsContinuity/ (about
      25,800 lines; 190 in PD/ and 1 in Thm4/) are adapted from its development version: finite and
      infinite-volume FK measures, FKG and comparison inequalities, finite energy, box limits, planar
      duality on rectangles and 16 of its definitions (PD/Defs/, not part of the statement surface
      here). 165 of them come from files that the public repository contains at this commit (after a
      port to the module system). The other 26 (26 of the 44 modules of PottsContinuity/PD/RCInfinite/, the Burton-Keane
      uniqueness of the infinite cluster, about 4,300 lines) come from files of the development
      version that the public repository does not contain, so their source is not publicly
      accessible. All are relocated to the namespace PottsContinuity.PD, and declarations not used
      here were removed; 101 of them had been adapted there, in whole or in part, from FKconvergence.
      Each says so in its header. The statements of the main theorems are not taken from it. Eight
      of the 22 definitions of the statement surface (box, squareLattice, rcOpenGraph,
      rcFreeClusterCount, rcWiredClusterCount, rcWeight, rcProb, rcInfiniteOpenGraph) have the same
      Lean code as the definitions of the same names in that repository's Challenge.lean (their
      docstrings differ, and vertexBoundary, used by rcWiredClusterCount, is written differently
      there but equivalently), and
      IsRCInfiniteVolumeLimit uses its cylinder-event form with every exhaustion in place of boxes;
      all were checked against this paper before being frozen. The other definitions are not taken
      from it.
  - id: "https://github.com/openai/math at commit fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb, directory lean/OAI/Probability/SLE"
    relationship: "adapts"
    note: >-
